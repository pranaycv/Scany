name: Scany
options:
  bundleIdPrefix: com.pranaycv
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
targets:
  Scany:
    type: application
    platform: iOS
    sources:
      - path: Scany
        excludes:
          - "Preview Content"
      - path: Scany/Preview Content
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pranaycv.Scany
        INFOPLIST_FILE: Scany/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scany
        INFOPLIST_KEY_NSCameraUsageDescription: "Scany uses the camera to detect, straighten, and capture document pages."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ARCHS: arm64
        DEVELOPMENT_ASSET_PATHS: '"Scany/Preview Content"'
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: targeted
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MSAL
        product: MSAL
    scheme:
      testTargets: []
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    from: 1.5.0
